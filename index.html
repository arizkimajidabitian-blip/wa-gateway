<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA Web Gateway</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #f0f2f5; }
    #sidebar { width: 300px; border-right: 1px solid #ccc; background: #fff; display: flex; flex-direction: column; }
    #status-bar { padding: 10px; background: #075e54; color: #fff; text-align: center; font-size: 14px; }
    #qr-container { padding: 15px; text-align: center; }
    #qr-img { width: 180px; height: 180px; }
    #contact-list { flex: 1; overflow-y: auto; list-style: none; }
    .contact-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    .contact-item:hover, .contact-item.active { background: #e9edef; }
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    #chat-header { padding: 15px; background: #f0f2f5; font-weight: bold; border-bottom: 1px solid #ccc; }
    #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .msg.me { align-self: flex-end; background: #d9fdd3; }
    .msg.them { align-self: flex-start; background: #fff; }
    #input-area { padding: 10px; background: #f0f2f5; display: flex; gap: 10px; }
    #input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    #input-area button { padding: 10px 20px; background: #00a884; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="status-bar">Menghubungkan...</div>
    <div id="qr-container" style="display: none;">
      <p style="font-size: 12px; margin-bottom: 5px;">Scan QR Code ini:</p>
      <img id="qr-img" src="" alt="QR Code">
    </div>
    <ul id="contact-list"></ul>
  </div>

  <div id="chat-area">
    <div id="chat-header">Pilih Kontak untuk Memulai Chat</div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="target-number" placeholder="Nomor (628xxx)" style="width: 120px; flex: none;">
      <input type="text" id="message-text" placeholder="Ketik pesan...">
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    // GANTI LINK DI BAWAL INI DENGAN URL BACKEND RAILWAY KAMU
    const BACKEND_URL = "https://web-production-xxxx.up.railway.app"; 
    
    const socket = io(BACKEND_URL);
    let allMessages = [];
    let selectedJid = "";

    // Socket listeners
    socket.on('status', status => {
      document.getElementById('status-bar').innerText = status;
    });

    socket.on('qr', qrBase64 => {
      const qrBox = document.getElementById('qr-container');
      if (qrBase64) {
        qrBox.style.display = 'block';
        document.getElementById('qr-img').src = qrBase64;
      } else {
        qrBox.style.display = 'none';
      }
    });

    socket.on('contacts-updated', () => loadContacts());
    socket.on('incoming-message', msg => {
      allMessages.push(msg);
      if (selectedJid === msg.chatJid) renderMessages();
    });

    // Ambil Data dari MongoDB via Backend
    async function loadContacts() {
      try {
        const res = await fetch(`${BACKEND_URL}/contacts`);
        const contacts = await res.json();
        const list = document.getElementById('contact-list');
        list.innerHTML = '';
        contacts.forEach(c => {
          const li = document.createElement('li');
          li.className = `contact-item ${selectedJid === c.jid ? 'active' : ''}`;
          li.innerText = c.name || c.jid;
          li.onclick = () => selectContact(c.jid, c.name);
          list.appendChild(li);
        });
      } catch (err) { console.error('Error load contacts:', err); }
    }

    async function loadMessages() {
      try {
        const res = await fetch(`${BACKEND_URL}/messages`);
        allMessages = await res.json();
        renderMessages();
      } catch (err) { console.error('Error load messages:', err); }
    }

    function selectContact(jid, name) {
      selectedJid = jid;
      document.getElementById('chat-header').innerText = name || jid;
      document.getElementById('target-number').value = jid;
      loadContacts();
      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      if (!selectedJid) return;

      const filtered = allMessages.filter(m => m.chatJid === selectedJid);
      filtered.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.fromMe ? 'me' : 'them'}`;
        div.innerText = m.text;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const number = document.getElementById('target-number').value;
      const message = document.getElementById('message-text').value;
      if (!number || !message) return alert('Isi nomor dan pesan!');

      await fetch(`${BACKEND_URL}/send-message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number, message })
      });

      document.getElementById('message-text').value = '';
    }

    // Initial Load
    loadContacts();
    loadMessages();
  </script>
</body>
</html>
