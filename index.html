<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard WA Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #fff; width: 100%; max-width: 450px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 24px; text-align: center; }
    h2 { color: #075e54; margin-bottom: 20px; }
    
    /* Config Section */
    .config-box { background: #e7fce3; border: 1px solid #b2edaa; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 13px; }
    .config-box label { font-weight: bold; display: block; margin-bottom: 4px; color: #128c7e; }
    .config-box input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; }

    /* QR & Status Section */
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 15px; background: #ffeeba; color: #856404; }
    .status-badge.connected { background: #d4edda; color: #155724; }
    .qr-container { width: 200px; height: 200px; border: 2px dashed #ccc; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: hidden; }
    .qr-container img { width: 100%; height: 100%; object-fit: contain; }

    /* Test Message Form */
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #555; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #25d366; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.2s; }
    button:hover { background: #128c7e; }
  </style>
</head>
<body>

  <div class="container">
    <h2>WA Gateway Panel</h2>

    <!-- Input URL Server Backend (bisa local/ngrok) -->
    <div class="config-box">
      <label for="serverUrl">Backend / Ngrok Server URL:</label>
      <input type="text" id="serverUrl" placeholder="http://localhost:3000 atau https://xxx.ngrok-free.app">
    </div>

    <!-- Status Koneksi & QR Code -->
    <div id="statusBadge" class="status-badge">Menunggu Server...</div>
    <div class="qr-container">
      <img id="qrImage" src="" alt="QR Code" style="display:none;">
      <span id="qrPlaceholder" style="color: #888; font-size: 12px;">QR Code tampil di sini</span>
    </div>

    <!-- Form Tes Send Message -->
    <div class="form-group">
      <label>Nomor Tujuan (contoh: 628123456789)</label>
      <input type="text" id="targetNumber" placeholder="628xxxxxxxx">
    </div>
    <div class="form-group">
      <label>Pesan</label>
      <textarea id="messageText" rows="3" placeholder="Ketik pesan di sini..."></textarea>
    </div>
    <button onclick="sendMessage()">Kirim Pesan Tes</button>
  </div>

  <!-- CDN Socket.io Client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    let socket;
    const serverUrlInput = document.getElementById('serverUrl');

    // Auto connect socket saat input URL diubah
    serverUrlInput.addEventListener('change', () => {
      const url = serverUrlInput.value.trim();
      if (url) connectSocket(url);
    });

    function connectSocket(url) {
      if (socket) socket.disconnect();
      
      socket = io(url);

      socket.on('connect', () => {
        document.getElementById('statusBadge').innerText = 'Terhubung ke Backend';
      });

      socket.on('status', (msg) => {
        const badge = document.getElementById('statusBadge');
        badge.innerText = msg;
        if(msg.includes('Terhubung')) {
          badge.classList.add('connected');
        } else {
          badge.classList.remove('connected');
        }
      });

      socket.on('qr', (qrBase64) => {
        const img = document.getElementById('qrImage');
        const placeholder = document.getElementById('qrPlaceholder');
        if (qrBase64) {
          img.src = qrBase64;
          img.style.display = 'block';
          placeholder.style.display = 'none';
        } else {
          img.style.display = 'none';
          placeholder.style.display = 'block';
        }
      });
    }

    async function sendMessage() {
      const serverUrl = serverUrlInput.value.trim();
      const number = document.getElementById('targetNumber').value;
      const message = document.getElementById('messageText').value;

      if (!serverUrl) return alert('Masukkan Server URL terlebih dahulu!');
      if (!number || !message) return alert('Isi nomor dan pesan!');

      try {
        const res = await fetch(`${serverUrl}/send-message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number, message })
        });
        const data = await res.json();
        alert(data.message || 'Pesan terkirim!');
      } catch (err) {
        alert('Gagal mengirim pesan: ' + err.message);
      }
    }
  </script>
</body>
</html>
