<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Lite</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Segoe UI, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background: #d1d7db; height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    #login-box { background: white; padding: 30px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
    #login-box input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; }
    #login-box button { width: 100%; padding: 10px; background: #00a884; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

    #app-container { display: none; width: 95%; max-width: 1200px; height: 90vh; background: #fff; border-radius: 5px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
    .layout { display: flex; height: 100%; }

    .sidebar { width: 35%; border-right: 1px solid #e9edef; background: #fff; display: flex; flex-direction: column; }
    .sidebar-header { background: #f0f2f5; padding: 10px 16px; border-bottom: 1px solid #e9edef; display: flex; justify-content: space-between; align-items: center; }
    .new-chat-box { padding: 10px; background: #fff; border-bottom: 1px solid #e9edef; display: flex; gap: 5px; }
    .new-chat-box input { flex: 1; padding: 8px; border: 1px solid #e9edef; border-radius: 5px; }
    .new-chat-box button { padding: 8px 12px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 12px 16px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
    .chat-item:hover, .chat-item.active { background: #f0f2f5; }
    .chat-item .name { font-weight: bold; font-size: 15px; color: #111b21; }
    .chat-item .last-msg { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { background: #f0f2f5; padding: 10px 16px; border-bottom: 1px solid #e9edef; font-weight: bold; }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg-bubble.me { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
    .msg-bubble.them { background: #fff; align-self: flex-start; border-top-left-radius: 0; }
    
    .input-area { background: #f0f2f5; padding: 10px; display: flex; gap: 10px; align-items: center; }
    .input-area input { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; outline: none; }
    .input-area button { padding: 12px 20px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    #qr-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    #qr-modal img { width: 220px; height: 220px; margin-top: 15px; }
  </style>
</head>
<body>

  <div id="login-box">
    <h2>WhatsApp Web 🔒</h2>
    <input type="password" id="passInput" placeholder="Masukkan Password">
    <button onclick="login()">Masuk</button>
  </div>

  <div id="app-container">
    <div id="qr-modal" style="display:none;">
      <h3 id="status-text">Menghubungkan...</h3>
      <img id="qr-img" src="" style="display:none;">
    </div>

    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <strong>Chat</strong>
        </div>
        <div class="new-chat-box">
          <input type="text" id="newNumber" placeholder="Nomor baru (08xxx)">
          <button onclick="startNewChat()">+ Chat</button>
        </div>
        <div class="chat-list" id="chatList"></div>
      </div>

      <div class="chat-panel">
        <div class="chat-header" id="activeChatHeader">Pilih Obrolan</div>
        <div class="messages-container" id="messagesBox"></div>
        <div class="input-area">
          <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendMsg()">
          <button onclick="sendMsg()">Kirim</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SECRET_PASSWORD = "admin123";
    const SERVER_URL = "https://wa-backend-production-9b30.up.railway.app";
    
    let socket;
    let chats = {};
    let activeTarget = null;

    function login() {
      if (document.getElementById('passInput').value === SECRET_PASSWORD) {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        initSocket();
      } else {
        alert('Password Salah!');
      }
    }

    function initSocket() {
      socket = io(SERVER_URL);

      socket.on('status', (msg) => {
        document.getElementById('status-text').innerText = msg;
        if (msg === 'Terhubung') {
          document.getElementById('qr-modal').style.display = 'none';
        } else {
          document.getElementById('qr-modal').style.display = 'flex';
        }
      });

      socket.on('qr', (qrBase64) => {
        const qrImg = document.getElementById('qr-img');
        if (qrBase64) {
          qrImg.src = qrBase64;
          qrImg.style.display = 'block';
        } else {
          qrImg.style.display = 'none';
        }
      });

      // Terima riwayat pesan lama dari sinkronisasi WA
      socket.on('history-message', (data) => {
        addMessage(data.from, data.text, data.fromMe);
      });

      // Terima pesan baru real-time
      socket.on('incoming-message', (data) => {
        addMessage(data.from, data.text, data.fromMe);
      });
    }

    function formatNumber(num) {
      let cleaned = num.replace(/[^0-9]/g, '');
      if (cleaned.startsWith('0')) cleaned = '62' + cleaned.slice(1);
      return cleaned;
    }

    function startNewChat() {
      const input = document.getElementById('newNumber');
      if (!input.value) return;
      const num = formatNumber(input.value);
      if (!chats[num]) chats[num] = [];
      selectChat(num);
      input.value = '';
    }

    function selectChat(num) {
      activeTarget = num;
      document.getElementById('activeChatHeader').innerText = num;
      renderChatList();
      renderMessages();
    }

    function addMessage(target, text, fromMe) {
      const num = formatNumber(target);
      if (!chats[num]) chats[num] = [];
      chats[num].push({ fromMe, text });
      
      renderChatList();
      if (activeTarget === num) renderMessages();
    }

    function renderChatList() {
      const listEl = document.getElementById('chatList');
      listEl.innerHTML = '';
      
      Object.keys(chats).forEach(num => {
        const lastMsg = chats[num][chats[num].length - 1]?.text || '';
        const div = document.createElement('div');
        div.className = `chat-item ${activeTarget === num ? 'active' : ''}`;
        div.onclick = () => selectChat(num);
        div.innerHTML = `
          <div class="name">${num}</div>
          <div class="last-msg">${lastMsg}</div>
        `;
        listEl.appendChild(div);
      });
    }

    function renderMessages() {
      const box = document.getElementById('messagesBox');
      box.innerHTML = '';
      if (!activeTarget || !chats[activeTarget]) return;

      chats[activeTarget].forEach(m => {
        const div = document.createElement('div');
        div.className = `msg-bubble ${m.fromMe ? 'me' : 'them'}`;
        div.innerText = m.text;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value;
      if (!text || !activeTarget) return;

      input.value = '';
      addMessage(activeTarget, text, true);

      try {
        await fetch(`${SERVER_URL}/send-message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: activeTarget, message: text })
        });
      } catch (err) {
        alert('Gagal mengirim pesan');
      }
    }
  </script>
</body>
</html>
